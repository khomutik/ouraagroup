name: Проверки сайта

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Проверить синтаксис PHP
        run: find . -name '*.php' -not -path './support-chat-worker/node_modules/*' -print0 | xargs -0 -n1 php -l
      - name: Проверить функции сайта
        run: |
          for test in tests/*.js; do node "$test"; done
          for test in tests/*.php; do php "$test"; done

  chat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: support-chat-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: support-chat-worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  deploy:
    needs: [site, chat]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Подготовить SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/site-deploy
          chmod 600 ~/.ssh/site-deploy
          printf '%s\n' '194.60.132.53 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDJ9IYnAVvgMgWqSN5KcmKZFSQDKUv3602QMSH2IbLBy' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Обновить сайт на сервере
        run: git archive --format=tar "$GITHUB_SHA" | ssh -T -i ~/.ssh/site-deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes site-deploy@194.60.132.53
